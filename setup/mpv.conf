# Video output using Vulkan (gpu-next / libplacebo backend)
vo=gpu
gpu-api=opengl

# Use VA-API for hardware decoding (for Intel iGPU)
# vaapi-copy trades a small perf cost for better stability vs zero-copy vaapi
hwdec=vaapi-copy
hwdec-codecs=h264,hevc,vp9

# Scaling - good quality/performance balance for an iGPU
scale=bilinear
cscale=bilinear

# Smoother playback sync to display refresh rate
video-sync=display-resample
interpolation=no

# Cache / smoother seeking
cache=yes
demuxer-max-bytes=150MiB

# Default Audio Language
alang=en

# Screenshot as high quality png instead of low-quality jpg
screenshot-format=png

# Keep window state between launches
#save-position-on-quit

# For Playing Youtube Videos with yt-dlp
script-opts=ytdl_hook-ytdl_path=/home/sam/.local/bin/yt-dlp
ytdl-format=137+140/bestvideo+bestaudio/301
